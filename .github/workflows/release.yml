name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload assets to (e.g. v1.0.2)'
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -e .

      - name: Refresh picotool (macOS arm64)
        run: |
          brew install picotool
          mkdir -p resources/tools/macos
          cp "$(which picotool)" resources/tools/macos/picotool
          xattr -c resources/tools/macos/picotool || true

      - name: Read version
        id: version
        run: |
          v=$(python -c "import re,pathlib; print(re.search(r'^__version__ = \"([^\"]+)\"', pathlib.Path('fdd_updater/__init__.py').read_text(), re.M).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build .app with PyInstaller
        run: python -m PyInstaller installer/fdd_updater.spec --clean --noconfirm

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "FDD Firmware Updater" \
            -srcfolder "dist/FDD Firmware Updater.app" \
            -ov -format UDZO \
            "dist/FDD-Firmware-Updater-macOS-v${{ steps.version.outputs.version }}.dmg"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/FDD-Firmware-Updater-macOS-v${{ steps.version.outputs.version }}.dmg

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -e .

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path fdd_updater\__init__.py -Pattern '^__version__\s*=\s*"([^"]+)"' |
                Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      # One-file EXE: self-contained, no install step and no Python on the
      # user's machine. Double-click to run. This is also the asset the in-app
      # auto-updater downloads and swaps in place.
      - name: Build one-file EXE with PyInstaller
        run: python -m PyInstaller installer/fdd_updater_windows.spec --clean --noconfirm

      - name: Rename EXE with version
        shell: pwsh
        run: |
          Move-Item "dist\FDD Firmware Updater.exe" `
                    "dist\FDD-Firmware-Updater-Windows-v${{ steps.version.outputs.version }}.exe"

      - name: Upload EXE to release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/FDD-Firmware-Updater-Windows-v${{ steps.version.outputs.version }}.exe
